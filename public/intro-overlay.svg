<svg
  width="100%"
  height="100%"
  viewBox="0 0 1440 900"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid slice"
>
  <!-- Fondo -->
  <rect width="1440" height="900" fill="#000000" />

  <!-- Marco tipo cine -->
  <rect
    x="60"
    y="60"
    width="1320"
    height="780"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    opacity="0.6"
  />

  <!-- Líneas decorativas -->
  <line x1="200" y1="180" x2="1240" y2="180" stroke="#fff" opacity="0.2" />
  <line x1="200" y1="720" x2="1240" y2="720" stroke="#fff" opacity="0.2" />

  <!-- Título principal -->
  <text
    x="720"
    y="430"
    text-anchor="middle"
    fill="#ffffff"
    font-size="96"
    font-family="Times New Roman, serif"
    letter-spacing="8"
  >
    CINECLUB
  </text>

  <!-- Subtítulo -->
  <text
    x="720"
    y="510"
    text-anchor="middle"
    fill="#ffffff"
    font-size="64"
    font-family="Times New Roman, serif"
    letter-spacing="6"
    opacity="0.9"
  >
    FOREVER
  </text>

  <!-- Tagline -->
  <text
    x="720"
    y="580"
    text-anchor="middle"
    fill="#ffffff"
    font-size="20"
    font-family="Arial, sans-serif"
    letter-spacing="4"
    opacity="0.5"
  >
    PELICULAS · COMUNIDAD · CULTO  </text>

  <!-- Call to action -->
  <text
    x="720"
    y="820"
    text-anchor="middle"
    fill="#ffffff"
    font-size="14"
    font-family="Arial, sans-serif"
    letter-spacing="3"
    opacity="0.6"
  >
    CLICK PARA ENTRAR
  </text>

  <!-- Grano sutil -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.04" />
    </feComponentTransfer>
  </filter>

  <rect
    width="1440"
    height="900"
    filter="url(#grain)"
    opacity="0.15"
  />
</svg>
